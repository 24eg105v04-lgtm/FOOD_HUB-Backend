
# Server Configuration
server.port=8080
server.address=0.0.0.0

# Application Name
spring.application.name=foodhub-backend

# ===================================================================
# DATABASE CONFIGURATION
# Current Active: H2 In-Memory (Zero setup required, preloaded with demo data)
# Access H2 Web Console: http://localhost:8080/h2-console
# ===================================================================
spring.datasource.url=jdbc:h2:mem:foodhubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Web Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

